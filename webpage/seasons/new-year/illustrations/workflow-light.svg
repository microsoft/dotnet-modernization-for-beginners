<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="illustration-workflow-light-title illustration-workflow-light-desc" data-illustration="workflow" data-era="1970s" data-theme="light">
  <title id="illustration-workflow-light-title">Move forward. Look back.</title>
  <desc id="illustration-workflow-light-desc">The workflow runs in order: Assess, read the report and add a requirement if needed; Plan, request and review the plan; Upgrade, make the approved changes; Review, inspect changes and run the app. If requirements are missed, the dashed correction route returns from Review to Plan.</desc>

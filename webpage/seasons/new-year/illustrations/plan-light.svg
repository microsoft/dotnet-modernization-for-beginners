  <title id="illustration-plan-light-title">Shape the upgrade plan</title>
  <desc id="illustration-plan-light-desc">A desktop planning scene links 1 Request plan: Ask the agent, to 2 Review choices: In-place and EF Core, to 3 Check plan: Read tasks and checks. The stage guidance is Review before execution. Building and running the app happens in Chapter 06, not during planning.</desc>

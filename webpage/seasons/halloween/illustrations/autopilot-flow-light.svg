          <text x="675" y="394" fill="#252b29" font-size="22" font-weight="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" letter-spacing="0"><tspan x="675" dy="0">Update the code</tspan><tspan x="675" dy="28.16">and dependencies</tspan></text>

          <text x="935" y="346" fill="#252b29" font-size="29" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" letter-spacing="0"><tspan x="935" dy="0">Validate</tspan></text>
          <text x="925" y="394" fill="#252b29" font-size="22" font-weight="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" letter-spacing="0"><tspan x="925" dy="0">Build and check</tspan><tspan x="925" dy="28.16">the application</tspan></text>


          <text x="185" y="346" fill="#252b29" font-size="29" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" letter-spacing="0"><tspan x="185" dy="0">Assess</tspan></text>
          <text x="175" y="394" fill="#252b29" font-size="22" font-weight="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" letter-spacing="0"><tspan x="175" dy="0">Find changes</tspan><tspan x="175" dy="28.16">for .NET 10</tspan></text>
          <path d="M290 370h20" fill="none" stroke="#79521f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#illustration-autopilot-flow-light-arrow)"/><rect x="310" y="290" width="230" height="175" rx="16" fill="#fffaf0" stroke="#bdc6bd" stroke-width="2"/>

      <text x="550" y="619" fill="#55615b" font-size="23" font-weight="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" letter-spacing="0"><tspan x="550" dy="0">Run BookCatalog and check a saved edit after restart.</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="illustration-autopilot-flow-light-title illustration-autopilot-flow-light-desc" data-illustration="autopilot-flow" data-era="autopilot" data-theme="light">
  <title id="illustration-autopilot-flow-light-title">One goal, continuous progress</title>
  <desc id="illustration-autopilot-flow-light-desc">The BookCatalog folder and .NET 10 goal start an automatic sequence: Assess, Plan, Upgrade, and Validate. No new prompt is needed at each stage. The learner follows Canvas, steers the plan when needed, then runs the app and checks that a saved edit remains after restart. The steering path returns to the plan without restarting the upgrade.</desc>
  <defs>
    <marker id="illustration-autopilot-flow-light-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L11 6 1 11Z" fill="#79521f"/></marker>
    <marker id="illustration-autopilot-flow-light-return" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L11 6 1 11" fill="none" stroke="#55615b" stroke-width="2"/></marker>
    <marker id="illustration-autopilot-flow-light-trail" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 6 1 11Z" fill="#fffaf0"/></marker>

  </defs>
  <rect width="1100" height="720" fill="#eee5cf"/>
  <text x="60" y="89" fill="#252b29" font-size="44" font-weight="400" text-anchor="start" font-family="Georgia, serif" letter-spacing="0"><tspan x="60" dy="0">One goal. Continuous progress.</tspan></text><text x="63" y="132" fill="#55615b" font-size="23" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" letter-spacing="0"><tspan x="63" dy="0">Copilot runs the stages. You steer and try the app.</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="illustration-workflow-dark-title illustration-workflow-dark-desc" data-illustration="workflow" data-era="1970s" data-theme="dark">
  <title id="illustration-workflow-dark-title">Move forward. Look back.</title>
  <desc id="illustration-workflow-dark-desc">The workflow runs in order: Assess, read the report and add a requirement if needed; Plan, request and review the plan; Upgrade, make the approved changes; Review, inspect changes and run the app. If requirements are missed, the dashed correction route returns from Review to Plan.</desc>

name: Course validation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: dotnet test tests/BookCatalog.Tests/BookCatalog.Tests.csproj --configuration Release
      - run: dotnet test tests/BookCatalog.Data.Tests/BookCatalog.Data.Tests.csproj --configuration Release
      - run: az bicep build --file examples/azure/main.bicep --outfile "${{ runner.temp }}/bookcatalog-arm.json"
      - run: npm run build
      - run: npm run test:content
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
  windows-legacy:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Check the isolated legacy application
        shell: powershell
        run: ./scripts/Test-LegacyApp.ps1
      - name: Check isolated SQL Server record transfer
        shell: powershell
        run: ./scripts/Test-DataTransfer.ps1
      - name: Check the modernized application on isolated LocalDB
        shell: powershell
        run: ./scripts/Test-ModernizedApp.ps1

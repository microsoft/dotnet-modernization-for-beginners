name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/content
          cp -R webpage/. _site/
          cp README.md LICENSE _site/content/

          for chapter in 00-introduction 01-assessment 02-planning 03-upgrade-execution 04-cloud; do
            cp -R "$chapter" "_site/content/$chapter"
          done

      - name: Generate Mermaid SVGs
        shell: bash
        run: |
          npm install --global @mermaid-js/mermaid-cli@11.16.0
          node webpage/tools/render-mermaid.mjs _site/content _site/diagrams

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5